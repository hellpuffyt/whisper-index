name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: coverage floor
        run: pytest -q --cov --cov-fail-under=95

  build-and-search-the-example:
    name: build and search the bundled example end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e .

      # The example mixes a Whisper JSON file and an SRT file, both
      # mentioning "supply chain". Results are asserted exactly: 3
      # segments, each with score 2 (one match per query term), spanning
      # both files and both formats.
      - name: exact search results across both formats
        run: |
          set -euo pipefail
          whisper-index build examples --out /tmp/index.json
          whisper-index search --index /tmp/index.json "supply chain" \
            --format json | python -c "
          import json, sys
          hits = json.load(sys.stdin)
          assert len(hits) == 3, hits
          assert all(h['score'] == 2.0 for h in hits), hits
          assert all(len(h['match_spans']) == 2 for h in hits), hits
          sources = {h['source'].replace(chr(92), '/').rsplit('/', 1)[-1] for h in hits}
          assert sources == {'episode1.json', 'episode2.srt'}, sources
          print('example search results are exactly as documented')
          "
          whisper-index search --index /tmp/index.json "zzznomatch" | grep -q "no matches"

      - name: zero runtime dependencies
        run: |
          set -euo pipefail
          python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          assert deps == [], f"runtime dependencies declared: {deps}"
          print("dependencies = [] holds")
          EOF
